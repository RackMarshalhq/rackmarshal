name: Quickstart
# Proves what the docs promise: the docs match the code, and the released bundle installs on a
# fresh machine with systemd, comes up healthy with no incidents, takes a database snapshot, runs
# two soak samples under real systemd, and uninstalls cleanly.
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    # `bash` here means `bash -e -o pipefail`: a failure inside a pipe fails the step.
    shell: bash
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs match the code
        run: python3 scripts/check-docs.py
  fresh-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      - run: ./scripts/build-installer-bundle.sh
      - name: Make the runner look like Debian 12 (the installer rightly refuses writable parent folders)
        run: |
          # GitHub's Ubuntu image has /opt at 0777 and /var/log at root:syslog 0775. Debian 12 has 0755 root:root.
          sudo chmod 0755 /opt /var/log
          sudo chown root:root /var/log
          # A default ACL on a parent makes new folders ignore the installer's umask.
          sudo setfacl -k /opt /var/log /etc /var/lib || true
          getfacl -p /opt | tee "$RUNNER_TEMP/opt-acl.txt"
      - name: Install exactly as INSTALL.md says
        run: |
          # The same steps as INSTALL.md: root extracts into a root-owned folder and runs the installer there.
          sudo sh -c 'umask 022; mkdir /root/rm-install && tar --no-same-owner -xzf "$1" -C /root/rm-install' sh "$PWD"/dist/rackmarshal-installer-*.tar.gz
          sudo sh -c 'umask 022; cd /root/rm-install/rackmarshal-installer-* && ./scripts/install.sh --wheel ./rackmarshal-*-py3-none-any.whl' 2>&1 | tee "$RUNNER_TEMP/install.log"
          grep -q RACKMARSHAL_INSTALL_OK "$RUNNER_TEMP/install.log"
      - name: Show the installer output if it failed
        if: failure()
        run: |
          tail -30 "$RUNNER_TEMP/install.log" | while IFS= read -r line; do echo "::error title=install::${line:0:240}"; done || true
          stat -c '%A %U:%G %n' / /opt /etc /var /var/lib /var/log | while IFS= read -r line; do echo "::error title=install-ancestors::$line"; done || true
          { getfacl -p /opt; sudo find /opt/rackmarshal -maxdepth 6 -type d -perm /022 -exec stat -c '%A %U:%G %n' {} + 2>/dev/null | head -10; sudo sh -c 'umask'; } | while IFS= read -r line; do echo "::error title=install-acl::$line"; done || true
      - name: Base install is healthy and shows no incidents
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9110/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9110/)" = 200
          curl -s http://127.0.0.1:9110/v1/incidents | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["data"]==[], d'
      - name: Commands the quickstart tells people to run
        run: |
          cfg=/etc/rackmarshal/rackmarshal.conf
          sudo /opt/rackmarshal/venv/bin/rackmarshal validate-config --config "$cfg"
          sudo /opt/rackmarshal/venv/bin/rackmarshal setup-plan --config "$cfg"
          sudo /opt/rackmarshal/venv/bin/rackmarshal domains
          systemctl is-active rackmarshal-status.service rackmarshal-notify.timer rackmarshal-db-snapshot.timer rackmarshal-observation-prune.timer
      - name: The installer's database snapshot exists and is valid
        run: |
          sudo test -f /var/lib/rackmarshal/db-snapshots/state.db.latest
          sudo python3 -I -B -c 'import sqlite3; c=sqlite3.connect("file:/var/lib/rackmarshal/db-snapshots/state.db.latest?mode=ro", uri=True); assert c.execute("PRAGMA quick_check").fetchone()[0]=="ok"'
      - name: Let systemd finish starting (the soak requires a fully running system)
        run: |
          state=$(timeout 120 sudo systemctl is-system-running --wait || true)
          echo "systemd: $state"
          if [ "$state" != running ]; then
            sudo systemctl --failed --plain --no-legend --no-pager | tee "$RUNNER_TEMP/failed-units.txt" || true
            # GitHub's image has a failed mnt.mount that has nothing to do with RackMarshal. Only that unit may be cleared.
            if [ "$(awk '{print $1}' "$RUNNER_TEMP/failed-units.txt" | sort -u | tr '\n' ' ')" = "mnt.mount " ]; then
              sudo systemctl reset-failed mnt.mount
            fi
            state=$(sudo systemctl is-system-running || true)
            echo "systemd after clearing the runner's own failure: $state"
            test "$state" = running
          fi
      - name: Soak preflight refuses a machine that was not declared disposable
        run: |
          cd qualification/soak
          if sudo sh -c "umask 077; python3 -I -B launch.py --target-hostname $(hostname) --source-commit $GITHUB_SHA" > "$RUNNER_TEMP/preflight.out"; then
            echo "preflight unexpectedly passed without the marker file" >&2; exit 1
          fi
          grep -q 'PREFLIGHT_FAILED' "$RUNNER_TEMP/preflight.out"
          grep -q 'rackmarshal-soak-target' "$RUNNER_TEMP/preflight.out"
      - name: Soak launches and takes two samples under real systemd
        run: |
          sudo sh -c 'hostname > /etc/rackmarshal-soak-target && chmod 644 /etc/rackmarshal-soak-target'
          cd qualification/soak
          sudo sh -c "umask 077; python3 -I -B launch.py --target-hostname $(hostname) --source-commit $GITHUB_SHA" | tee "$RUNNER_TEMP/preflight2.out"
          grep -q PREFLIGHT_OK "$RUNNER_TEMP/preflight2.out"
          sudo sh -c "umask 077; python3 -I -B launch.py --target-hostname $(hostname) --source-commit $GITHUB_SHA --launch" | tee "$RUNNER_TEMP/launch.out"
          grep -q SOAK_STARTED "$RUNNER_TEMP/launch.out"
          sudo systemctl start rmq-soak.service
          sudo test -f /var/lib/rackmarshal-soak/receipts/00000001.json
          sudo test ! -e /var/lib/rackmarshal-soak/STOP.json
          sudo systemctl stop rmq-soak.timer
      - name: Show the soak evidence if it failed
        if: failure()
        run: |
          { echo "systemd:"; sudo systemctl is-system-running; cat "$RUNNER_TEMP/failed-units.txt" "$RUNNER_TEMP/jobs.txt" 2>/dev/null; } | head -20 | while IFS= read -r line; do echo "::error title=systemd-state::${line:0:240}"; done || true
          cat "$RUNNER_TEMP/preflight2.out" "$RUNNER_TEMP/launch.out" 2>/dev/null | head -30 | while IFS= read -r line; do echo "::error title=soak-launch::${line:0:240}"; done || true
          sudo journalctl -u rmq-soak.service --no-pager -n 60 | tail -40 | while IFS= read -r line; do echo "::error title=soak::${line:0:240}"; done || true
          sudo cat /var/lib/rackmarshal-soak/STOP.json 2>/dev/null | head -c 1500 | while IFS= read -r line; do echo "::error title=soak-stop::${line:0:240}"; done || true
          sudo find /var/lib/rackmarshal-soak/samples -name '*.json' -path '*checks*' 2>/dev/null | head -20 | while IFS= read -r f; do sudo grep -l '"FAIL"' "$f" 2>/dev/null | while IFS= read -r bad; do echo "::error title=soak-check::$bad: $(sudo head -c 300 "$bad")"; done; done || true
      - name: Standard uninstall keeps config and state
        run: |
          sudo systemctl stop rmq-soak.timer rmq-soak.service || true
          sudo sh -c 'cd /root/rm-install/rackmarshal-installer-* && ./scripts/uninstall.sh'
          test ! -e /opt/rackmarshal
          sudo test -f /etc/rackmarshal/rackmarshal.conf
          sudo test -f /var/lib/rackmarshal/state.db
