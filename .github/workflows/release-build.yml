name: Release Build
on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Same-repository run containing release-qualification receipts
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: release-qualification
          path: .qualification
          run-id: ${{ inputs.qualification_run_id }}
          github-token: ${{ github.token }}
      - run: python -m pip install build
      - name: Build candidate assets
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python -m build
          ./scripts/build-installer-bundle.sh
          label=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"].replace("rc","-rc"))')
          python scripts/build-investigator-plugin.py --surface local --output "dist/rackmarshal-investigator-${label}-local.zip"
      - name: Verify qualification and scan exact assets before checksums
        env:
          CANDIDATE_SOURCE: ${{ github.sha }}
        run: python scripts/release-candidate-gate.py --source "$CANDIDATE_SOURCE" --record .qualification/release.json
      - uses: actions/upload-artifact@v4
        with:
          name: rackmarshal-release-candidate
          path: |
            dist/*
            SHA256SUMS
