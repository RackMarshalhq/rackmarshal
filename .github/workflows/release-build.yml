name: Release Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      - run: ./scripts/build-installer-bundle.sh
      - run: sha256sum dist/* | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rackmarshal-release-candidate
          path: |
            dist/*
            SHA256SUMS
