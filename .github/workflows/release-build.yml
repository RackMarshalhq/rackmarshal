name: Release Build
# Builds the release assets only after the qualification gate passes. A tag push alone never builds
# or publishes anything. To also create a DRAFT GitHub release, name an existing tag in
# draft_release_tag; nothing is public until a maintainer reviews and publishes the draft.
on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Same-repository run containing release-qualification receipts
        required: true
        type: string
      draft_release_tag:
        description: Optional. An existing tag (for example v1.3.0-rc1) to attach the assets to as a DRAFT release
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: release-qualification
          path: .qualification
          run-id: ${{ inputs.qualification_run_id }}
          github-token: ${{ github.token }}
      - run: python -m pip install build
      - name: Build candidate assets
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python -m build
          ./scripts/build-installer-bundle.sh
          label=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"].replace("rc","-rc"))')
          python scripts/build-investigator-plugin.py --surface local --output "dist/rackmarshal-investigator-${label}-local.zip"
      - name: Verify qualification and scan exact assets before checksums
        env:
          CANDIDATE_SOURCE: ${{ github.sha }}
        run: python scripts/release-candidate-gate.py --source "$CANDIDATE_SOURCE" --record .qualification/release.json
      - uses: actions/upload-artifact@v7
        with:
          name: rackmarshal-release-candidate
          path: |
            dist/*
            SHA256SUMS
  draft-release:
    if: inputs.draft_release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.draft_release_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: rackmarshal-release-candidate
          path: release
      - name: The tag must match this commit and the package version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "${TAG#v}" != "$(printf '%s' "$version" | sed 's/rc/-rc/')" ] && [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG does not match package version $version" >&2; exit 1
          fi
          git fetch --tags --quiet
          if [ "$(git rev-list -n1 "refs/tags/$TAG")" != "$GITHUB_SHA" ]; then
            echo "Tag $TAG does not point at the commit that was qualified and built ($GITHUB_SHA)" >&2; exit 1
          fi
      - name: Checksums still match
        run: cd release && sha256sum -c SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --verify-tag --title "$TAG")
          case "$TAG" in *rc*|*dev*|*a[0-9]*|*b[0-9]*) flags+=(--prerelease) ;; esac
          notes="docs/releases/${TAG}.md"
          if [ -f "$notes" ]; then
            flags+=(--notes-file "$notes")
          else
            flags+=(--notes "Draft. Replace with release notes before publishing. Verify downloads with: sha256sum -c SHA256SUMS")
          fi
          gh release create "$TAG" release/dist/* release/SHA256SUMS "${flags[@]}"
