name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Plain, as a normal user with the runner's default umask (002): tests must not depend on the machine.
      - name: Unit tests
        run: python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/unittest.log"
      - name: Surface test failures as annotations
        if: failure()
        run: |
          grep -E '^(FAIL|ERROR):|^(\w+Error|\w+Exception)[:(]|^Ran ' "$RUNNER_TEMP/unittest.log" | head -40 | while IFS= read -r line; do echo "::error title=unittest::${line:0:240}"; done || true
      - run: python -m compileall -q rackmarshal
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: rackmarshal --version
      - name: Validate generic configuration
        run: |
          tmp=$(mktemp)
          printf 'STATE_DB=/tmp/rackmarshal-ci.db\n' > "$tmp"
          rackmarshal validate-config --config "$tmp"
      - name: Build database from migrations
        run: |
          tmp=$(mktemp -d)
          printf 'STATE_DB=%s/state.db\n' "$tmp" > "$tmp/config"
          RACKMARSHAL_CONFIG="$tmp/config" python -m rackmarshal.db.migrations.migrate --db "$tmp/state.db" --apply --yes
      - name: Publication and smoke gates
        run: ./scripts/publication-gate.sh 2>&1 | tee "$RUNNER_TEMP/gate.log"
      - name: Surface gate failures as annotations
        if: failure()
        run: |
          grep -v -E '^(test_|Ran |OK|-+$|$)|\.\.\. ok$' "$RUNNER_TEMP/gate.log" | tail -25 | while IFS= read -r line; do echo "::error title=gate::${line:0:240}"; done || true
      - name: Installer shell validation
        run: bash -n scripts/install.sh scripts/uninstall.sh scripts/build-installer-bundle.sh scripts/publication-gate.sh
  test-as-root:
    # The installer and lifecycle code run as root on real hosts, so run the whole suite that way too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo sh -c 'exec env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v'
