[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rackmarshal"
version = "1.1.0.dev0"
description = "Local-first infrastructure operations and incident management for self-hosted systems."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "RackMarshal"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]

[project.scripts]
rackmarshal = "rackmarshal.cli:main"
rackmarshal-explain = "rackmarshal.incidents.explain:main"

[project.urls]
Homepage = "https://rackmarshal.com"
Repository = "https://github.com/RackMarshalhq/rackmarshal"

[tool.setuptools.packages.find]
include = ["rackmarshal*"]

[tool.setuptools.package-data]
"rackmarshal.db.migrations" = ["*.sql"]
"rackmarshal.domains" = ["*/plugin.toml"]
